version: 0.2.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  flutter_local_notifications: ^17.2.0
  geolocator: ^13.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  local_auth: ^2.3.0
  shared_preferences: ^2.2.0
  battery_plus: ^6.0.0
  vibration: ^2.0.0
